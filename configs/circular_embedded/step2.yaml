# Step 2: pixelated cloak. Baselines without optimisation, then neural-field optimisation.
#   .venv/bin/python scripts/circular_pixel_baseline.py --config configs/circular_embedded/step2.yaml
#   .venv/bin/python scripts/circular_optimize.py --config configs/circular_embedded/step2.yaml
base_config: configs/circular_embedded/step1.yaml
output_dir: output/circular_step2
sources:
  on_diagonal: [-3.0, -3.0]
  off_diagonal: [-3.5, -2.0]
baseline:
  maps: [linear, quadratic]
  methods: [average, centre]     # how pixel values sample the ideal material
  # (n_theta, n_r), so the pixel count is their product
  grids: [[50, 10], [36, 7], [24, 5], [15, 4]]
# Sources for optimisation. All lie on one mesh, so one factorisation per frequency serves them all.
# train: in the loss. val: selects the best design. test: never used for any decision.
source_groups:
  train:   # ring r = 3.5 m, every 45 degrees from 22.5
    [[3.234, 1.339], [1.339, 3.234], [-1.339, 3.234], [-3.234, 1.339],
     [-3.234, -1.339], [-1.339, -3.234], [1.339, -3.234], [3.234, -1.339]]
  val:     # other radii and angles
    [[2.5, 0.0], [0.0, 4.5], [-2.5, 0.0], [0.0, -4.5]]
  test:    # the two Step 1 sources, plus two more
    [[-3.0, -3.0], [-3.5, -2.0], [3.0, 3.0], [2.2, -1.5]]
optimize:                        # defaults for every run
  radial_map: quadratic
  grid: [50, 10]
  f_star: [1.0]                  # training frequencies; one factorisation each
  eval_f_star: []                # further frequencies for the final report
  loss: complex                  # complex | magnitude
  train_fraction: 0.5            # of exterior points; the rest are held out
  steps: 600
  lr: 0.002
  lr_end: 0.0002                 # cosine decay
  checkpoint_every: 10
  print_every: 10
  backend: pardiso
  network: {hidden: 128, layers: 3, n_theta_modes: 8, n_r_modes: 4, seed: 0, output_scale: 0.1}
runs:
  # Single-frequency runs, also reported at other frequencies to show how far they carry.
  f1_500:          {eval_f_star: [0.5, 1.5, 2.0]}
  f1_500_linear:   {radial_map: linear, eval_f_star: [0.5, 1.5, 2.0]}
  f1_252:          {grid: [36, 7], eval_f_star: [0.5, 1.5, 2.0]}
  f1_120:          {grid: [24, 5], eval_f_star: [0.5, 1.5, 2.0]}
  f1_60:           {grid: [15, 4], eval_f_star: [0.5, 1.5, 2.0]}
  # Frequency band: one factorisation per frequency.
  band_500:        {f_star: [0.5, 1.0, 1.5], eval_f_star: [0.75, 1.25, 2.0]}
  # Frequency pool: 2 frequencies drawn per step, on one mesh and one factorisation each.
  pool_500:
    f_star: []
    f_pool: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5]
    freqs_per_step: 2
    val_every: 25
    init_from: band_500
    # Steps 0-1500 ran with lr 0.001 -> 0.0001 (cosine). Continued to 3000 with a small rate, so the
    # cosine schedule over 3000 steps gives about 1.3e-4 at step 1500, tapering to 5e-5.
    steps: 3000
    lr: 0.0002
    lr_end: 0.00005
    eval_f_star: [0.5, 0.6, 0.75, 0.9, 1.0, 1.1, 1.25, 1.4, 1.5, 1.75, 2.0]
